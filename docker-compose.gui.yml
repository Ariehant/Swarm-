# Optional Linux X11/XWayland GUI. Core simulation remains headless.
services:
  gui:
    image: three-drone-sim:1.0
    platform: linux/amd64
    network_mode: service:sim
    depends_on:
      sim:
        condition: service_healthy
    environment:
      DISPLAY: ${DISPLAY:?Set DISPLAY from your desktop session}
      XAUTHORITY: /tmp/xauthority
      GZ_PARTITION: three_drone_swarm
      LIBGL_ALWAYS_SOFTWARE: "1"
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      - ${XAUTHORITY:?Set XAUTHORITY to your X11 cookie file}:/tmp/xauthority:ro
    command:
      - bash
      - -c
      - 'source /opt/PX4/build/px4_sitl_default/rootfs/gz_env.sh && exec gz sim -g'
